<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="照書養POS">
<meta name="theme-color" content="#2f5d50">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>照書養 POS</title>
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#1d1d1b;--mute:#76746c;--line:#e2ded3;--pri:#2f5d50;--pri2:#e6efeb;--warn:#c27c0e;--bad:#c0392b;--ok:#2e7d32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
/* 頂列 */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.locBtn,.dateBox{white-space:nowrap}
.tl,.tr{display:flex;gap:10px;align-items:center;min-width:0}.tr{justify-content:flex-end}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.brand img{height:42px;width:auto;max-width:140px;object-fit:contain}
.brand span{font-weight:800;font-size:20px;letter-spacing:.5px;white-space:nowrap;color:var(--pri)}
.locBtn{border:0;background:var(--pri);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:18px}
.dateBox{position:relative;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:16px}
.dateBox.alt{border-color:var(--warn);color:var(--warn);font-weight:700}
.dateBox input{position:absolute;inset:0;opacity:0;width:100%}
.sync{border:0;border-radius:99px;padding:9px 14px;font-size:15px;background:var(--pri2);color:var(--pri);font-weight:600;max-width:26vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync.wait{background:#fdf0dc;color:var(--warn)}
.icoBtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-size:16px}
/* 主畫面 */
.pos{flex:1;display:grid;grid-template-columns:1fr 360px;min-height:0}
.prod{overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.tile{position:relative;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;min-height:132px;display:flex;flex-direction:column;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile.sel{border-color:var(--pri);background:var(--pri2)}
.tile .nm{font-size:20px;font-weight:800;line-height:1.25}
.tile .sub{font-size:13px;color:var(--mute);margin-top:4px}
.tile .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.tile .stk{font-size:15px;color:var(--mute)}
.tile .stk b{font-size:24px;color:var(--ink)}
.tile .stk.neg b{color:var(--bad)}
.tile .pr{font-size:18px;font-weight:700}
.tile .cnt{position:absolute;top:-10px;right:-8px;background:var(--pri);color:#fff;border-radius:99px;min-width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:18px;padding:0 8px}
.tag{font-size:12px;padding:1px 6px;border-radius:6px;background:var(--warn);color:#fff}
/* 購物車 */
.side{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart{flex:1;overflow-y:auto;padding:8px 16px}
.ln{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.lnm{flex:1;font-weight:700}.lnm small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.st{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--pri2);font-size:24px;font-weight:700}
.q{min-width:34px;text-align:center;font-size:22px}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pays.dim{opacity:.3;pointer-events:none}
.chip{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font-weight:700;font-size:16px;text-align:center}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.sum .amt{font-size:34px;font-weight:800}
.sum small{color:var(--mute);font-size:14px}
.big{width:100%;border:0;border-radius:18px;padding:20px;font-size:22px;font-weight:800;background:var(--pri);color:#fff}
.big:disabled{opacity:.35}
.sec{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px;font-size:15px;font-weight:600}
.sec.on{border-color:var(--warn);color:var(--warn);background:#fdf0dc}
/* 彈窗 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet.open{display:flex}
.panel{background:var(--card);border-radius:22px;width:min(760px,100%);max-height:92dvh;overflow-y:auto;padding:20px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ph h2{margin:0;font-size:22px}
.x{border:0;background:var(--pri2);border-radius:12px;padding:10px 16px;font-weight:700}
.lbl{font-size:14px;color:var(--mute);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{padding:12px 18px}
.olot{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.olot .nm{flex:1;font-weight:700}.olot .nm small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.olot .q{min-width:52px}
.plus10{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 10px;font-weight:700}
.inp{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.neg{color:var(--bad);font-weight:700}
.log{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.log .t{flex:1}.log small{display:block;color:var(--mute)}
.s-ok{color:var(--ok)}.s-wait{color:var(--warn)}.s-err{color:var(--bad)}.s-undo{color:var(--mute)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pad button{border:1px solid var(--line);background:var(--pri2);border-radius:16px;padding:20px 0;font-size:26px;font-weight:700}
.padv{font-size:44px;font-weight:800;text-align:right;padding:8px 4px;border-bottom:2px solid var(--line);min-height:70px}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.locs button{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:26px 10px;font-size:22px;font-weight:800}
.locs button.on{border-color:var(--pri);background:var(--pri2)}
.prow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow .t{flex:1}.prow small{display:block;color:var(--mute);font-size:14px}
.prow .sku{color:var(--mute);font-size:13px}.prow .pp{font-size:20px;font-weight:800}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.panel h3{margin:22px 0 4px;font-size:18px;color:var(--pri);border-top:1px solid var(--line);padding-top:14px}
.brow{display:grid;grid-template-columns:1fr 1fr 52px;gap:8px;margin:8px 0}
.del{border:1px solid var(--line);background:#fff;border-radius:12px;font-size:18px}
.tag.new{background:#5b7fa8}
.bdg{display:block;font-size:11px;font-weight:700;color:var(--warn);text-align:right}
#flash{position:fixed;inset:0;display:none;place-items:center;background:rgba(46,125,50,.92);color:#fff;font-size:44px;font-weight:800;z-index:40;text-align:center}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.2s;z-index:50;max-width:90vw;pointer-events:none}
#toast.show{opacity:1}
.note{font-size:14px;color:var(--mute);margin-top:8px}
@media (max-width:900px) and (min-width:701px){.pos{grid-template-columns:1fr 310px}.sec{font-size:14px;padding:10px 4px}}
@media (max-width:1050px){.icoBtn .lb{display:none}.brand span{font-size:17px}.brand img{height:36px}}
@media (max-width:700px){.pos{grid-template-columns:1fr;grid-template-rows:1fr auto}.side{border-left:0;border-top:1px solid var(--line);max-height:55dvh}.top{grid-template-columns:1fr}.tr{justify-content:flex-start}.sync{max-width:none;flex:1}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="tl">
      <button class="locBtn" id="locBtn">📍 —</button>
      <label class="dateBox" id="dateBox"><span id="dateTxt"></span><input type="date" id="dateInp"></label>
    </div>
    <!-- 品牌區：替換 logo.png 即可換 Logo；名稱在 ⚙︎ 設定修改 -->
    <div class="brand"><img src="logo.png" alt="" id="brandLogo" onerror="this.style.display='none'"><span id="brandName"></span></div>
    <div class="tr">
      <button class="sync" id="syncBtn">—</button>
      <button class="icoBtn" data-open="ops">📦<span class="lb"> 作業</span></button>
      <button class="icoBtn" data-open="stock">📊<span class="lb"> 庫存</span></button>
      <button class="icoBtn" data-open="prod">🏷<span class="lb"> 商品</span></button>
      <button class="icoBtn" data-open="set">⚙︎</button>
    </div>
  </div>
  <div class="pos">
    <div class="prod"><div class="grid" id="tiles"></div></div>
    <div class="side">
      <div class="cart" id="cart"></div>
      <div class="foot">
        <div class="pays" id="pays"></div>
        <div class="row">
          <button class="sec" id="padBtn">✎ 改實收</button>
          <button class="sec" id="giftBtn">🎁 試吃</button>
          <button class="sec" id="clearBtn">清空</button>
        </div>
        <div class="sum"><span><span id="sumQty">0 包</span><br><small id="sumNote"></small></span><span class="amt" id="sumAmt">$0</span></div>
        <button class="big" id="checkout" disabled>結帳</button>
      </div>
    </div>
  </div>
</div>

<!-- 據點 -->
<div class="sheet" id="s-loc"><div class="panel">
  <div class="ph"><h2>現在在哪裡？</h2><button class="x" data-close>關閉</button></div>
  <div class="locs" id="locList"></div>
</div></div>

<!-- 改實收 -->
<div class="sheet" id="s-pad"><div class="panel" style="width:min(420px,100%)">
  <div class="ph"><h2>實收金額</h2><button class="x" data-close>取消</button></div>
  <div class="note" id="padHint"></div>
  <div class="padv" id="padV">$0</div>
  <div class="pad" id="pad"></div>
  <div class="row" style="margin-top:12px">
    <button class="sec" id="padReset">恢復定價</button>
    <button class="big" id="padOk" style="flex:2;padding:16px">確定</button>
  </div>
</div></div>

<!-- 庫存作業 -->
<div class="sheet" id="s-ops"><div class="panel">
  <div class="ph"><h2>庫存作業</h2><button class="x" data-close>關閉</button></div>
  <div class="chips" id="opKinds"></div>
  <div class="note" id="opHint"></div>
  <div id="fromBox"><div class="lbl">從</div><div class="chips" id="opFrom"></div></div>
  <div id="toBox"><div class="lbl">到</div><div class="chips" id="opTo"></div></div>
  <div class="lbl">品項與數量</div>
  <div id="opLots"></div>
  <div class="lbl">備註（可空白）</div>
  <input class="inp" id="opNote">
  <button class="big" id="opSubmit" style="margin-top:16px">送出</button>
</div></div>

<!-- 庫存 -->
<div class="sheet" id="s-stock"><div class="panel">
  <div class="ph"><h2>庫存</h2><button class="x" data-close>關閉</button></div>
  <div style="overflow-x:auto"><table id="stockTbl"></table></div>
  <div class="note" id="stockNote"></div>
  <button class="sec" id="refreshBtn" style="width:100%;margin-top:12px;padding:14px">↻ 從試算表更新（需網路）</button>
</div></div>

<!-- 紀錄 -->
<div class="sheet" id="s-log"><div class="panel">
  <div class="ph"><h2>交易紀錄</h2><button class="x" data-close>關閉</button></div>
  <div class="note" id="logErr"></div>
  <div id="logList"></div>
  <button class="sec" id="retryBtn" style="width:100%;margin-top:12px;padding:14px">立即上傳</button>
</div></div>

<!-- 商品與售價 -->
<div class="sheet" id="s-prod"><div class="panel">
  <div class="ph"><h2 id="prodTitle">商品與售價</h2><button class="x" id="prodBack">關閉</button></div>
  <div id="prodBody"></div>
</div></div>

<!-- 設定 -->
<div class="sheet" id="s-set"><div class="panel">
  <div class="ph"><h2>設定</h2><button class="x" data-close>關閉</button></div>
  <div class="lbl">API 網址（Apps Script 部署網址，結尾 /exec）</div>
  <input class="inp" id="cfgApi" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off">
  <div class="lbl">PIN</div>
  <input class="inp" id="cfgPin" type="password" inputmode="numeric">
  <div class="lbl">操作人</div>
  <input class="inp" id="cfgOp" placeholder="例：Paul">
  <div class="lbl">畫面上方名稱</div>
  <input class="inp" id="cfgBrand" placeholder="照書養">
  <button class="big" id="cfgSave" style="margin-top:16px">儲存並下載資料</button>
  <button class="sec" data-open="log" style="width:100%;margin-top:10px;padding:14px">交易紀錄</button>
  <button class="sec" id="updBtn" style="width:100%;margin-top:10px;padding:14px">檢查 App 更新</button>
  <div class="note" id="cfgInfo"></div>
</div></div>

<div id="flash"></div>
<div id="toast"></div>

<script>
const VER='1.1.1';
const LS={cfg:'bk_cfg',boot:'bk_boot',srv:'bk_srv',q:'bk_q',log:'bk_log'};
const PAYS=['現金','LINE Pay','轉帳'];
const KINDS=[['move','調撥'],['back','收攤退回'],['in','進貨'],['gift','試吃/贈品'],['scrap','報廢']];
const MASTER=new Set(['product','lot','bundle']);
const MAX_PROD=30,MAX_LOT=60;   // DASHBOARD【二】【一】公式範圍上限
const WD='日一二三四五六';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n||0).toLocaleString();
function ls(k,v){try{if(v===undefined){const s=localStorage.getItem(k);return s?JSON.parse(s):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('本機儲存失敗：'+e.message);return null}}
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
const clean=e=>String(e&&e.message||e).replace(/^(NET|BAD):/,'');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3000)}
function flash(m){const f=$('#flash');f.textContent=m;f.style.display='grid';setTimeout(()=>f.style.display='none',900)}

let CFG=Object.assign({api:'',pin:'',op:'',loc:'',brand:'照書養'},ls(LS.cfg)||{});
let SRV=ls(LS.srv);   // 最後一次從試算表下載＋已上傳成功的資料
let BOOT=null;        // 畫面用：SRV ＋ 尚未上傳的變更
let cart=[],pay='現金',gift=false,paid=null,flushing=false,lastErr='',lastOk=null,dateOverride='';
const saveCfg=()=>ls(LS.cfg,CFG);
const Q=()=>ls(LS.q)||[];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const curDate=()=>dateOverride||today();
const lotOf=id=>BOOT&&BOOT.lots.find(l=>l.lot===id);
const prodOf=sku=>BOOT&&BOOT.products&&BOOT.products[sku];
const priceOf=l=>{const p=l&&prodOf(l.sku);return p?Number(p.price)||0:(Number(l&&l.price)||0)};
const shortOf=l=>{const p=l&&prodOf(l.sku);return p?p.short:(l&&(l.short||l.sku))||''};
const gkey=sku=>{const p=prodOf(sku);return (p&&p.group||'').trim()||sku};
const stockAt=(l,w)=>(l&&l.stock&&l.stock[w])||0;
const locNames=()=>BOOT?BOOT.locations.map(l=>l.name):[];
const mainLoc=()=>locNames()[0]||'';

/* ---------- 資料層：SRV ＋ 待上傳佇列 → BOOT ---------- */
function deltas(p){const o=[];(p.lines||[]).forEach(x=>{
  if(p.kind==='sale'||p.kind==='gift')o.push([x.lot,p.loc,-x.qty]);
  if(p.kind==='scrap')o.push([x.lot,p.from,-x.qty]);
  if(p.kind==='in')o.push([x.lot,p.to,x.qty]);
  if(p.kind==='move'){o.push([x.lot,p.from,-x.qty]);o.push([x.lot,p.to,x.qty])}});
  if(p.kind==='lot'&&+p.qty>0)o.push([p.lot,p.to,+p.qty]);
  return o}
function applyDelta(B,p,sign){deltas(p).forEach(([lot,w,d])=>{const l=B.lots.find(x=>x.lot===lot);if(!l)return;l.stock=l.stock||{};
  l.stock[w]=(l.stock[w]||0)+d*sign;l.total=(l.total||0)+d*sign})}
function applyMaster(B,p){
  B.products=B.products||{};B.bundles=B.bundles||{};
  if(p.kind==='product'){
    const o=B.products[p.sku]||{};
    B.products[p.sku]=Object.assign({},o,{sku:p.sku,short:p.short,name:p.name||o.name||p.short,spec:p.spec||'',temp:p.temp||o.temp||'常溫',
      price:Number(p.price)||0,safety:p.safety,group:p.group||''});
    B.lots.forEach(l=>{if(l.sku===p.sku){l.price=Number(p.price)||0;l.short=p.short;l.display=p.short+' / '+l.lot.slice(-4)}});
  }
  if(p.kind==='bundle'){if(p.rows.length)B.bundles[p.group]=p.rows.map(r=>({qty:+r.qty,price:+r.price}));else delete B.bundles[p.group]}
  if(p.kind==='lot'&&!B.lots.some(l=>l.lot===p.lot)){
    const pr=B.products[p.sku]||{};
    B.lots.push({lot:p.lot,sku:p.sku,mfg:p.mfg||'',expiry:p.exp,cost:+p.cost||0,display:(pr.short||p.sku)+' / '+p.lot.slice(-4),
      days:null,grade:'',stock:{},total:0,price:pr.price||0,short:pr.short||p.sku});
  }
}
function rebuild(){
  if(!SRV){BOOT=null;return}
  BOOT=clone(SRV);BOOT.products=BOOT.products||{};BOOT.bundles=BOOT.bundles||{};
  const pend=new Set();
  Q().forEach(p=>{applyMaster(BOOT,p);applyDelta(BOOT,p,1);if(p.kind==='lot')pend.add(p.lot)});
  BOOT.lots.forEach(l=>{if(pend.has(l.lot))l.pending=true});
  cart=cart.filter(c=>lotOf(c.lot));
  ls(LS.boot,BOOT);
}
(function migrate(){   // v1.0 只存 BOOT（已含待上傳），還原出 SRV
  if(SRV)return;const old=ls(LS.boot);if(!old)return;
  SRV=clone(old);Q().forEach(p=>applyDelta(SRV,p,-1));ls(LS.srv,SRV);
})();
rebuild();

/* ---------- API ---------- */
async function api(action,data){
  if(!CFG.api) throw new Error('NET:尚未設定 API 網址');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
  let r;
  try{r=await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({},data||{},{action,pin:CFG.pin})),signal:ctl.signal,redirect:'follow'})}

  if(!j.ok) throw new Error((j.fatal?'BAD:':'NET:')+j.error);

}

/* ---------- 組合價計算 ---------- */
/** 每個群組：單位依售價高→低排序，組合價套在最貴的單位上（對客人最有利、結果固定），用 DP 找最低總價 */
function priceCart(){
  const G={},order=[];
  cart.forEach(c=>{const l=lotOf(c.lot);if(!l)return;const price=priceOf(l),g=gkey(l.sku);
    if(!G[g]){G[g]={lines:[],units:[]};order.push(g)}
    G[g].lines.push({c,price});for(let i=0;i<c.qty;i++)G[g].units.push(price)});
  let total=0,list=0;const applied=[],lines=[];
  order.forEach(g=>{
    const X=G[g],u=X.units.sort((a,b)=>b-a),N=u.length,lt=u.reduce((s,v)=>s+v,0);list+=lt;
    const B=((BOOT.bundles||{})[g]||[]).filter(b=>b.qty>=2&&b.qty<=N);
    let gt=lt,best=0;const dp=Array(N+1).fill(Infinity),pick=Array(N+1).fill(-1);dp[0]=0;
    if(B.length){
      for(let k=1;k<=N;k++)B.forEach((b,i)=>{if(b.qty<=k&&dp[k-b.qty]+b.price<dp[k]){dp[k]=dp[k-b.qty]+b.price;pick[k]=i}});
      const suf=Array(N+1).fill(0);for(let i=N-1;i>=0;i--)suf[i]=suf[i+1]+u[i];
      for(let k=1;k<=N;k++)if(dp[k]+suf[k]<gt){gt=dp[k]+suf[k];best=k}
      const cnt={};for(let k=best;k>0;k-=B[pick[k]].qty){const b=B[pick[k]],key=b.qty+'包'+money(b.price);cnt[key]=(cnt[key]||0)+1}
      Object.entries(cnt).forEach(([k,n])=>applied.push(k+(n>1?'×'+n:'')));
    }
    total+=gt;let left=gt;
    X.lines.forEach((x,i)=>{const b=x.c.qty*x.price,a=i===X.lines.length-1?left:(lt?Math.round(gt*b/lt):0);left-=a;
      lines.push({lot:x.c.lot,qty:x.c.qty,price:x.price,amount:a})});
  });
  return {lines,total,list,applied};
}
function saleLines(){
  const pc=priceCart();if(paid==null)return pc.lines;
  const base=pc.lines.reduce((s,x)=>s+x.amount,0),n=pc.lines.length;let left=paid;
  return pc.lines.map((x,i)=>{const a=i===n-1?left:(base?Math.round(paid*x.amount/base):Math.round(paid/n));left-=a;return Object.assign({},x,{amount:a})});
}

  const k=bKey(),g=($('#fGroup')?.value||'').trim();
  const members=g?Object.values(BOOT.products).filter(p=>(p.group||'')===g&&p.sku!==PV.sku).map(p=>p.short):[];
  $('#bNote').textContent=PV.b.length?(g?`群組「${g}」共用這組價格`+(members.length?`（也包含：${members.join('、')}）`:'')+'，混搭數量合計即可套用':'只限本商品，數量達到即自動套用；同時符合多種組合時自動算最便宜'):'';
}
$('#prodBody').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bi!==undefined){PV.b[+t.dataset.bi][t.dataset.bf]=t.value;return}
  if(t.id==='fGroup'){PV.b=clone((BOOT.bundles||{})[bKey()]||[]);renderBRows()}
});
$('#prodBody').addEventListener('click',e=>{
  const tc=e.target.closest('[data-temp]');if(tc){document.querySelectorAll('#fTemp .chip').forEach(c=>c.classList.toggle('on',c===tc));return}
  const lc=e.target.closest('[data-to]');if(lc){document.querySelectorAll('#lTo .chip').forEach(c=>c.classList.toggle('on',c===lc));return}
  const b=e.target.closest('[data-pa]');if(!b)return;const a=b.dataset.pa;
  if(a==='new'){
    if(Object.keys(BOOT.products).length>=MAX_PROD)return toast('商品已達 '+MAX_PROD+' 個（DASHBOARD 上限），請先擴充試算表公式');
    PV={view:'form',sku:null,newSku:nextSku(),d:{short:'',price:'',name:'',spec:'',safety:'',temp:'常溫',group:''},b:[]};renderProd()}
  if(a==='edit'){const p=prodOf(b.dataset.sku);
    PV={view:'form',sku:p.sku,d:{short:p.short,price:p.price,name:p.name||'',spec:p.spec||'',safety:p.safety??'',temp:p.temp||'常溫',group:p.group||''},
      b:clone((BOOT.bundles||{})[gkey(p.sku)]||[])};renderProd()}
  if(a==='badd'){PV.b.push({qty:'',price:''});renderBRows();const ins=$('#bRows').querySelectorAll('input');if(ins.length)ins[ins.length-2].focus()}
  if(a==='bdel'){PV.b.splice(+b.dataset.i,1);renderBRows()}
  if(a==='newLot'){PV={view:'lot',sku:PV.sku};renderProd()}
  if(a==='saveLot'){const L=readLot(PV.sku);if(!L)return;const p=prodOf(PV.sku);
    if(!enqueue([{p:L,summary:`新批號 ${p.short} / ${L.lot}`+(L.qty?` 進貨 ${L.qty} 包 →${L.to}`:'')}]))return;
    flash('✓ 批號已建立');PV={view:'list'};renderProd()}
  if(a==='save')saveProduct();
});
function saveProduct(){
  const isNew=!PV.sku,sku=PV.sku||PV.newSku;
  const short=$('#fShort').value.trim(),priceS=$('#fPrice').value,group=$('#fGroup').value.trim();
  const temp=($('#fTemp .chip.on')||{}).dataset?.temp||'常溫';
  if(!short)return toast('請填商品簡稱');
  if(short.length>8)return toast('商品簡稱限 8 個字');
  if(priceS===''||!(+priceS>=0))return toast('請填單包售價');
  if(Object.values(BOOT.products).some(p=>p.short===short&&p.sku!==sku))return toast('已有同名商品「'+short+'」');
  const rows=PV.b.filter(r=>String(r.qty)!==''||String(r.price)!=='').map(r=>({qty:+r.qty,price:+r.price}));
  for(const r of rows){
    if(!(Number.isInteger(r.qty)&&r.qty>=2))return toast('組合數量需為 2 以上整數');
    if(!(r.price>=0)||String(r.price)==='NaN')return toast('請填組合價');
  }
  if(new Set(rows.map(r=>r.qty)).size!==rows.length)return toast('同一個數量只能設定一個組合價');
  rows.sort((a,b)=>a.qty-b.qty);
  const items=[];
  const prod={txId:uid(),kind:'product',sku,isNew,origShort:isNew?'':prodOf(sku).short,short,price:+priceS,
    name:$('#fName').value.trim(),spec:$('#fSpec').value.trim(),safety:$('#fSafety').value===''?'':+$('#fSafety').value,temp,group};
  let lot=null;
  if(isNew){lot=readLot(sku);if(!lot)return}
  items.push({p:prod,summary:(isNew?'新增商品 ':'修改商品 ')+short+' '+money(+priceS)});
  const key=group||sku,cur=JSON.stringify(((BOOT.bundles||{})[key]||[]).map(r=>({qty:+r.qty,price:+r.price})).sort((a,b)=>a.qty-b.qty));
  if(JSON.stringify(rows)!==cur)items.push({p:{txId:uid(),kind:'bundle',group:key,rows},
    summary:`組合價 ${group?'群組「'+group+'」':short}：`+(rows.length?rows.map(r=>r.qty+'包'+money(r.price)).join('、'):'取消')});
  if(lot)items.push({p:lot,summary:`新批號 ${short} / ${lot.lot}`+(lot.qty?` 進貨 ${lot.qty} 包 →${lot.to}`:'')});
  if(!enqueue(items))return;
  flash('✓ 已儲存');PV={view:'list'};renderProd();
}
$('#prodBack').addEventListener('click',()=>{if(PV.view==='list')closeSheets();else{PV={view:'list'};renderProd()}});

/* ---------- 庫存表 ---------- */
function renderStock(){
  if(!BOOT){$('#stockTbl').innerHTML='';return}
  const L=locNames();
  $('#stockTbl').innerHTML=`<tr><th>商品 / 批</th>${L.map(n=>`<th>${esc(n)}</th>`).join('')}<th>總計</th></tr>`+
    BOOT.lots.map(l=>`<tr><td>${esc(shortOf(l))} /${esc(l.lot.slice(-4))}<br><small style="color:var(--mute)">${esc(l.expiry)}・${esc(l.pending?'未上傳':l.grade)}</small></td>
    ${L.map(n=>{const v=stockAt(l,n);return `<td class="${v<0?'neg':''}">${v}</td>`}).join('')}<td><b>${l.total||0}</b></td></tr>`).join('');
  const n=Q().length;
  $('#stockNote').textContent=(n?`含 ${n} 筆尚未上傳的變更。`:'')+(SRV&&SRV.serverTime?`試算表資料時間：${SRV.today} ${SRV.serverTime}`:'');
}
$('#refreshBtn').addEventListener('click',async()=>{await flush();await refreshBoot(false);renderStock()});

/* ---------- 離線佇列 ---------- */
function logSet(id,patch){const L=ls(LS.log)||[];const i=L.findIndex(x=>x.txId===id);if(i>=0){Object.assign(L[i],patch);ls(LS.log,L)}renderLog()}
function enqueue(items){
  const q=Q();items.forEach(x=>q.push(x.p));
  if(ls(LS.q,q)===null){alert('⚠ 無法存入 iPad 本機儲存空間，這筆「沒有」被記錄，請手寫備份');return false}
  const L=ls(LS.log)||[],t=new Date().toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  items.forEach(x=>L.unshift({txId:x.p.txId,t,summary:x.summary,st:'wait'}));ls(LS.log,L.slice(0,300));
  rebuild();renderCart();setSync();flush();return true;
}
function dropHead(id){const q=Q();if(q[0]&&q[0].txId===id){q.shift();ls(LS.q,q)}}
/** 伺服器改配 SKU（兩台離線同時新增）→ 改寫佇列中後續引用 */
function remapSku(a,b){
  const q=Q().map(p=>{
    if((p.kind==='product'||p.kind==='lot')&&p.sku===a)p.sku=b;
    if(p.kind==='product'&&p.group===a)p.group=b;
    if(p.kind==='bundle'&&p.group===a)p.group=b;
    return p});
  ls(LS.q,q);
}
function setSrvStock(s){if(!s||!SRV)return;SRV.lots.forEach(l=>{const x=s[l.lot];if(x){l.stock=x.by;l.total=x.total}})}
async function flush(){
  if(flushing||!CFG.api||!SRV)return;flushing=true;setSync();let needBoot=false;
  try{for(;;){
    const q=Q();if(!q.length)break;const p=q[0];
    try{
      const r=await api('submit',p);
      let done=p;
      if(p.kind==='product'&&r.sku&&r.sku!==p.sku){remapSku(p.sku,r.sku);done=Object.assign({},p,{sku:r.sku})}
      dropHead(p.txId);
      if(MASTER.has(p.kind)){applyMaster(SRV,done);needBoot=true}
      if(r.stock)setSrvStock(r.stock);else applyDelta(SRV,done,1);ls(LS.srv,SRV);rebuild();
      lastErr='';lastOk=new Date();
      logSet(p.txId,{st:'ok',note:r.dup?'重送，試算表未重複寫入':(done!==p?'SKU 已改配為 '+r.sku:'')});
    }catch(e){const m=String(e.message||e);
      if(m.startsWith('BAD:')){dropHead(p.txId);rebuild();logSet(p.txId,{st:'err',note:clean(e)});toast('有一筆被試算表拒絕，請看紀錄')}
      else{lastErr=clean(e);logSet(p.txId,{note:'上傳失敗：'+lastErr});break}}
  }}finally{flushing=false;renderCart();setSync();if(isOpen('stock'))renderStock();if(isOpen('prod'))renderProd()}
  if(needBoot&&!Q().length)refreshBoot(true);
}
function undo(id){
  const q=Q(),i=q.findIndex(x=>x.txId===id);
  if(i<0)return toast('這筆已上傳，請到試算表修改（TxID 開頭 '+id+'）');
  if(flushing&&i===0)return toast('正在上傳中，稍後再試');
  const p=q[i];
  if(!confirm(MASTER.has(p.kind)?'撤銷這筆商品／批號／組合價變更？\n之後用到它的交易若上傳失敗，也需要一併撤銷。':'確定撤銷這筆？'))return;
  q.splice(i,1);ls(LS.q,q);rebuild();logSet(id,{st:'undo',note:'已撤銷，未寫入試算表'});renderCart();setSync();
  if(isOpen('prod'))renderProd();
}
function setSync(){
  const n=Q().length,b=$('#syncBtn');
  b.classList.toggle('wait',n>0);
  b.textContent=n?(flushing?`⏫ 上傳中 ${n}`:`⏳ 待上傳 ${n}`):(lastOk?`✓ 已同步 ${lastOk.toLocaleTimeString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit'})}`:'✓ 無待上傳');
}
function renderLog(){
  const L=ls(LS.log)||[],M={ok:['s-ok','✓ 已寫入'],wait:['s-wait','⏳ 待上傳'],err:['s-err','✗ 被拒絕'],undo:['s-undo','↶ 已撤銷']};
  $('#logErr').textContent=lastErr&&Q().length?'最近上傳失敗原因：'+lastErr:'';
  $('#logList').innerHTML=L.length?L.map(x=>`<div class="log"><span class="${M[x.st][0]}" style="min-width:86px">${M[x.st][1]}</span>
    <div class="t">${esc(x.summary)}<small>${esc(x.t)}${x.note?'・'+esc(x.note):''}</small></div>
    ${x.st==='wait'?`<button class="x" data-undo="${esc(x.txId)}">撤銷</button>`:''}</div>`).join(''):'<div class="empty">尚無紀錄</div>';
}
$('#logList').addEventListener('click',e=>{const b=e.target.closest('[data-undo]');if(b)undo(b.dataset.undo)});
$('#retryBtn').addEventListener('click',async()=>{await flush();toast(Q().length?'仍無法上傳：'+lastErr:'全部已上傳')});
$('#syncBtn').addEventListener('click',()=>{flush();openSheet('log')});

/* ---------- 設定 ---------- */
function renderSet(){
  $('#cfgApi').value=CFG.api;$('#cfgPin').value=CFG.pin;$('#cfgOp').value=CFG.op;$('#cfgBrand').value=CFG.brand||'';
  $('#cfgInfo').textContent=`版本 ${VER}・待上傳 ${Q().length} 筆・`+(BOOT?`${Object.keys(BOOT.products).length} 個商品 / ${BOOT.lots.length} 個批號 / ${BOOT.locations.length} 個據點`:'尚未下載資料');
}
$('#cfgSave').addEventListener('click',async()=>{
  CFG.api=$('#cfgApi').value.trim();CFG.pin=$('#cfgPin').value.trim();CFG.op=$('#cfgOp').value.trim();CFG.brand=$('#cfgBrand').value.trim();saveCfg();renderTop();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(CFG.api))return toast('網址格式應為 https://script.google.com/…/exec');
  $('#cfgSave').disabled=true;$('#cfgSave').textContent='連線中…';
  const ok=await refreshBoot(true);
  $('#cfgSave').disabled=false;$('#cfgSave').textContent='儲存並下載資料';
  if(ok){toast('連線成功，資料已下載');renderSet();flush();if(!CFG.loc)openSheet('loc');else closeSheets()}else toast('連線失敗：'+lastErr);
});

/* ---------- 彈窗 ---------- */
const isOpen=n=>$('#s-'+n).classList.contains('open');
function openSheet(n){
  if((n==='ops'||n==='stock'||n==='prod')&&!BOOT)return toast('請先到設定下載資料');
  closeSheets();
  if(n==='ops')setKind('move');if(n==='stock')renderStock();if(n==='log')renderLog();if(n==='set')renderSet();if(n==='loc')renderLocs();
  if(n==='prod'){PV={view:'list'};renderProd()}
  $('#s-'+n).classList.add('open');
}
function closeSheets(){document.querySelectorAll('.sheet.open').forEach(s=>s.classList.remove('open'))}
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o)return openSheet(o.dataset.open);
  if(e.target.closest('[data-close]'))return closeSheets();
  // 點背景關閉；商品表單與庫存作業不關，避免誤觸遺失輸入
  if(e.target.classList.contains('sheet')&&!['s-prod','s-ops'].includes(e.target.id))closeSheets();
});

/* ---------- 啟動 ---------- */
function renderAll(){renderTop();renderCart();setSync()}
renderAll();
/* 自動更新：新版 Service Worker 接手後自動重新載入（購物車有東西或視窗開著時等閒置再載入） */
let swReg=null,needReload=false;
if('serviceWorker' in navigator){
  const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl){needReload=true;tryReload()}});
  navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;r.update().catch(()=>{})}).catch(()=>{});
}
function tryReload(){
  if(!needReload)return;
  if(cart.length||document.querySelector('.sheet.open')){toast('新版已下載，結帳或關閉視窗後自動更新');return}
  needReload=false;location.reload();
}
setInterval(tryReload,3000);
$('#updBtn').addEventListener('click',async()=>{
  if(!swReg)return toast('此瀏覽器不支援自動更新');
  try{await swReg.update()}catch(e){return toast('檢查失敗：需要網路')}
  toast(swReg.installing||swReg.waiting?'發現新版，下載後自動重新載入':'目前已是最新版 '+VER+'（GitHub 更新後最多約 10 分鐘才會偵測到）');
});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if(!CFG.api)openSheet('set');else{flush().then(()=>refreshBoot(true))}
window.addEventListener('online',()=>flush());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){renderTop();flush();if(swReg)swReg.update().catch(()=>{})}});
setInterval(()=>{if(Q().length)flush()},15000);
</script>
</body>
